<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>成都巨量视界 · 学员案例合集</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#0d0d14; color:#fff; max-width:520px; margin:0 auto;
    padding-bottom:60px;
  }
  /* ---------- 头部 ---------- */
  header {
    position:relative; text-align:center; padding:34px 20px 26px;
    background:linear-gradient(160deg,#1a0b2e 0%,#3d0f3a 45%,#6e1423 100%);
    overflow:hidden;
  }
  header::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 80% 10%,rgba(255,60,100,.35),transparent 55%),
               radial-gradient(circle at 15% 90%,rgba(80,60,255,.3),transparent 50%);
    pointer-events:none;
  }
  .logo {
    width:84px; height:84px; border-radius:22px; object-fit:cover;
    box-shadow:0 8px 30px rgba(0,0,0,.5); position:relative; z-index:1;
  }
  header h1 { font-size:24px; margin-top:14px; letter-spacing:2px; position:relative; z-index:1; }
  header p { font-size:13px; color:rgba(255,255,255,.65); margin-top:8px; position:relative; z-index:1; }
  .stats-bar {
    display:flex; justify-content:center; gap:22px; margin-top:18px; position:relative; z-index:1;
  }
  .stats-bar div { text-align:center; }
  .stats-bar b { font-size:19px; color:#ffd54d; display:block; }
  .stats-bar span { font-size:11px; color:rgba(255,255,255,.6); }

  /* ---------- 吸顶导航 ---------- */
  nav {
    position:sticky; top:0; z-index:50; display:flex; gap:8px;
    padding:10px 14px; background:rgba(13,13,20,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  nav a {
    flex:1; text-align:center; font-size:12px; color:rgba(255,255,255,.75);
    text-decoration:none; padding:8px 0; border-radius:20px;
    background:rgba(255,255,255,.06); white-space:nowrap;
  }
  nav a.hot { background:linear-gradient(90deg,#ff2d55,#ff7a18); color:#fff; font-weight:600; }

  /* ---------- 分区标题 ---------- */
  .sec-title {
    display:flex; align-items:center; gap:10px;
    padding:30px 18px 6px;
  }
  .sec-title .bar { width:5px; height:22px; border-radius:3px; background:linear-gradient(180deg,#ff2d55,#ff7a18); }
  .sec-title h2 { font-size:19px; letter-spacing:1px; }
  .sec-sub { padding:2px 18px 14px; font-size:12px; color:rgba(255,255,255,.45); }

  /* ---------- 竖图双列网格 ---------- */
  .grid2 {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px;
  }
  .card {
    border-radius:14px; overflow:hidden; background:#191924;
    box-shadow:0 4px 16px rgba(0,0,0,.35); position:relative;
  }
  .card img, .card video { width:100%; display:block; }
  .grid2 .card img { aspect-ratio:9/16; object-fit:cover; object-position:top; }

  /* ---------- 横图整行 ---------- */
  .wide { padding:0 14px; display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .wide .card img { width:100%; }

  /* ---------- 数据区：浅色截图用浅色卡 ---------- */
  .data-sec .card { background:#f5f6fa; }

  /* ---------- 毕业照：私教课特写 ---------- */
  .grad-sec {
    margin-top:14px; padding-bottom:10px;
    border-top:1px solid rgba(255,213,77,.28);
    border-bottom:1px solid rgba(255,213,77,.28);
    background:linear-gradient(180deg,rgba(255,213,77,.05),transparent 30%);
  }
  .grad-badge {
    font-size:11px; padding:4px 12px; border-radius:12px; white-space:nowrap;
    background:linear-gradient(90deg,#ffd54d,#ff9a3d); color:#4a2c00; font-weight:700;
    letter-spacing:1px; box-shadow:0 2px 12px rgba(255,180,60,.4);
  }
  .grad-sec .card {
    background:#1c1526;
    border:1px solid rgba(255,213,77,.38);
    box-shadow:0 4px 18px rgba(255,180,60,.14);
  }
  .grad-sec .sec-title .bar { background:linear-gradient(180deg,#ffd54d,#ff9a3d); height:26px; }
  .grad-sec .sec-title h2 {
    font-size:21px;
    background:linear-gradient(90deg,#ffd54d,#ffb03d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:1px;
  }
  .grad-sec .sec-sub b { color:#ffd54d; font-weight:600; }

  /* ---------- 招生 CTA ---------- */
  .grad-cta {
    margin:16px 14px 6px; padding:24px 18px; text-align:center;
    border-radius:18px; background:linear-gradient(135deg,#ffd54d 0%,#ff9a3d 55%,#ff5e3a 100%);
    color:#4a1f00; box-shadow:0 8px 26px rgba(255,140,50,.35);
  }
  .grad-cta h3 { font-size:21px; letter-spacing:1px; }
  .grad-cta p { font-size:13px; margin-top:8px; font-weight:600; opacity:.85; }
  .grad-cta .pulse {
    display:inline-block; margin-top:12px; padding:8px 26px; border-radius:22px;
    background:#4a1f00; color:#ffd54d; font-size:14px; font-weight:700; letter-spacing:2px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }

  /* ---------- 视频 ---------- */
  .video-wrap { padding:0 14px 14px; }
  .video-wrap video { width:100%; border-radius:14px; display:block; box-shadow:0 4px 16px rgba(0,0,0,.35); }

  /* ---------- 灯箱 ---------- */
  #lightbox {
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.94);
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:96vw; max-height:86vh; border-radius:8px; }
  #lb-close {
    position:absolute; top:calc(env(safe-area-inset-top) + 14px); right:16px;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.15); color:#fff; font-size:20px;
  }
  footer { text-align:center; padding:34px 0 10px; font-size:12px; color:rgba(255,255,255,.35); }
</style>
</head>

function render(list, el) {
  const box = document.getElementById(el);
  for (const f of list) {
    const d = document.createElement('div');
    d.className = 'card';
    const img = document.createElement('img');
    img.src = 'assets/' + f.split('/').map(encodeURIComponent).join('/');
    img.loading = 'lazy';
    img.alt = '学员案例';
    img.onclick = () => openLB(img.src);
    d.appendChild(img);
    box.appendChild(d);
  }
}
